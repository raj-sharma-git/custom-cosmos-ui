{% extends "base.html" %}

{% block title %}Connect to Cosmos DB - CosmosUI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="position: relative;">
        <!-- Theme Toggle Switch for Login Card -->
        <div style="position: absolute; top: 20px; right: 20px; z-index: 10;">
            <button id="themeToggle" class="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Theme" type="button">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <div class="auth-header">
            <div class="auth-logo" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                <svg class="cosmos-logo-svg" viewBox="0 0 1258.7 878.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="width: 32px; height: 32px;">

                        <radialGradient id="loginLogoRad" cx="520.6" cy="129.6" r="250.5" gradientTransform="matrix(1.04 0 0 1.03 86.9 302.5)" gradientUnits="userSpaceOnUse">
                            <stop offset="18%" stop-color="#679CD3"/>
                            <stop offset="100%" stop-color="#2974BA"/>
                        </radialGradient>
                    </defs>
                    <path fill="#76CAE7" d="M375.2,282.1c-4.1,0-7.4-3.2-7.4-7.3v-0.1c-0.1-46.6-37.8-84.4-84.5-84.5c-4.1,0-7.4-3.3-7.4-7.4c0-4.1,3.3-7.4,7.4-7.4c46.6-0.1,84.4-37.9,84.5-84.5c0-4.1,3.3-7.4,7.3-7.4h0.1c4.1,0,7.4,3.2,7.4,7.3v0.1c0.1,46.6,37.8,84.4,84.5,84.5c4.1,0,7.4,3.2,7.4,7.3v0.1c0,4.1-3.3,7.4-7.3,7.4H467c-46.6,0-84.4,37.8-84.5,84.5C382.6,278.7,379.3,282,375.2,282.1z"/>
                    <path fill="#76CAE7" d="M907.3,794.6c-3.3,0-5.9-2.6-5.9-5.9c0-37.3-30.3-67.5-67.6-67.6c-3.3,0-5.9-2.6-5.9-5.9c0-3.3,2.6-5.9,5.9-5.9c37.3,0,67.5-30.2,67.5-67.5c0-3.3,2.7-5.9,5.9-5.9c3.3,0,5.9,2.7,5.9,5.9c0,37.3,30.3,67.5,67.6,67.6c3.3,0,5.9,2.6,5.9,5.9s-2.6,5.9-5.9,5.9c-37.3,0-67.5,30.3-67.6,67.6C913.2,791.9,910.6,794.6,907.3,794.6z"/>
                    <path fill="url(#loginLogoRad)" d="M880.4,377.3c33.1,138.6-52.5,277.8-191,310.9s-277.9-52.4-311-191s52.4-277.8,191-310.9C708,153.2,847.2,238.7,880.4,377.3z"/>
                    <path fill="#76CAE7" d="M973.7,221.8c-26.5-44-88.3-61.2-174.7-48.3c-29.6,4.2-58.9,10.5-87.5,19c22.7,7.9,44.4,18.7,64.2,32.2c10.1-2.2,20.3-4.9,30.1-6.4c15.3-2.4,30.8-3.6,46.4-3.7c30.8-4.4,61.8,7,82.4,30.5c16.1,26.8,2.5,72.7-37.2,126.1c-55.3,68.8-123,126.6-199.7,170.3c-74.9,46.8-158,79-244.9,95.1c-65.8,9.8-112.8,0-128.9-26.7c-16.1-26.7-2.5-72.7,37.3-125.9c4.9-6.6,6.1-9.8,11.7-16.5c-2.6-22.8-2.3-45.8,1.1-68.5c-17.9,17.9-34.3,37.2-49.2,57.7C272.7,526.3,258.6,589,285,633c28.4,38,74.8,58,121.9,52.5c17.6-0.1,35.2-1.5,52.6-4.2c92.7-16.9,181.4-51.1,261.5-100.9c81.7-46.8,153.9-108.6,212.8-182.1C986,328.5,1000.1,265.8,973.7,221.8z"/>
                    <path fill="#F2F2F2" opacity="0.85" d="M491,612.1c38,1.2,69.8-28.6,71.1-66.6c1.2-38-28.6-69.8-66.6-71.1c-0.3,0-0.6,0-0.9,0c-1.1,0-2.3,0-3.4,0c0.2-2,0.3-3.9,0.3-5.9c-0.3-38.3-31.6-69-69.8-68.8H370c-10.2,77.2,14.3,155,67.1,212.4H491z"/>

                </svg>
                <h1>Cosmos<span>UI</span></h1>
            </div>
            <p>Access your Cosmos DB containers with ease. Set up a secure direct connection below.</p>
        </div>

        <form action="{{ url_for('ui.login') }}" method="POST" class="auth-form" id="loginForm">
            <!-- Auth Method Tab Selectors -->
            <div class="auth-tabs">
                <label class="auth-tab">
                    <input type="radio" name="auth_method" value="conn_str" checked onclick="switchAuthTab('conn_str')">
                    <div class="tab-button">
                        <i class="fa-solid fa-link"></i>
                        <span>Connection String</span>
                    </div>
                </label>
                <label class="auth-tab">
                    <input type="radio" name="auth_method" value="key" onclick="switchAuthTab('key')">
                    <div class="tab-button">
                        <i class="fa-solid fa-key"></i>
                        <span>Account Key</span>
                    </div>
                </label>
                <label class="auth-tab">
                    <input type="radio" name="auth_method" value="sp" onclick="switchAuthTab('sp')">
                    <div class="tab-button">
                        <i class="fa-solid fa-users-gear"></i>
                        <span>Service Principal</span>
                    </div>
                </label>
            </div>

            <!-- Tab 1: Connection String -->
            <div class="form-group-tab active" id="tab-conn_str">
                <div class="input-wrapper">
                    <label for="conn_string">Cosmos DB Connection String</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-plug icon-inside"></i>
                        <textarea name="conn_string" id="conn_string" placeholder="AccountEndpoint=https://your-account.documents.azure.com:443/;AccountKey=your-key;"></textarea>
                    </div>
                    <span class="help-text">Enter the full Azure Cosmos DB connection string (Primary or Secondary).</span>
                </div>
            </div>

            <!-- Tab 2: Account Key -->
            <div class="form-group-tab" id="tab-key">
                <div class="input-wrapper">
                    <label for="endpoint_key">Endpoint URI</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-globe icon-inside"></i>
                        <input type="url" name="endpoint" id="endpoint_key" placeholder="https://your-account.documents.azure.com:443/">
                    </div>
                </div>
                <div class="input-wrapper">
                    <label for="account_key">Account Key</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-lock icon-inside"></i>
                        <input type="password" name="account_key" id="account_key" placeholder="your-primary-or-secondary-key">
                    </div>
                </div>
            </div>

            <!-- Tab 3: Service Principal -->
            <div class="form-group-tab" id="tab-sp">
                <div class="input-wrapper">
                    <label for="endpoint_sp">Endpoint URI</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-globe icon-inside"></i>
                        <input type="url" name="endpoint" id="endpoint_sp" placeholder="https://your-account.documents.azure.com:443/">
                    </div>
                </div>
                <div class="input-wrapper">
                    <label for="tenant_id">Tenant ID</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-building icon-inside"></i>
                        <input type="text" name="tenant_id" id="tenant_id" placeholder="00000000-0000-0000-0000-000000000000">
                    </div>
                </div>
                <div class="input-wrapper">
                    <label for="client_id">Client ID</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-id-card icon-inside"></i>
                        <input type="text" name="client_id" id="client_id" placeholder="00000000-0000-0000-0000-000000000000">
                    </div>
                </div>
                <div class="input-wrapper">
                    <label for="client_secret">Client Secret</label>
                    <div class="input-icon-group">
                        <i class="fa-solid fa-key icon-inside"></i>
                        <input type="password" name="client_secret" id="client_secret" placeholder="your-service-principal-secret">
                    </div>
                </div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember_credentials" checked>
                <label for="remember_credentials">Remember Endpoint Details (Saved locally in your browser)</label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <span>Connect Securely</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>
    </div>
</div>

<script>
    function switchAuthTab(tabName) {
        document.querySelectorAll('.form-group-tab').forEach(el => {
            el.classList.remove('active');
        });
        document.getElementById('tab-' + tabName).classList.add('active');
    }

    // Auto-load values from localStorage on page load
    document.addEventListener("DOMContentLoaded", function() {
        const storedMethod = localStorage.getItem("cosmos_auth_method");
        const storedConn = localStorage.getItem("cosmos_conn_str");
        const storedEndpoint = localStorage.getItem("cosmos_endpoint");
        const storedTenant = localStorage.getItem("cosmos_tenant_id");
        const storedClient = localStorage.getItem("cosmos_client_id");

        if (storedMethod) {
            const radio = document.querySelector(`input[name="auth_method"][value="${storedMethod}"]`);
            if (radio) {
                radio.checked = true;
                switchAuthTab(storedMethod);
            }
        }

        if (storedConn) document.getElementById("conn_string").value = storedConn;
        if (storedEndpoint) {
            document.getElementById("endpoint_key").value = storedEndpoint;
            document.getElementById("endpoint_sp").value = storedEndpoint;
        }
        if (storedTenant) document.getElementById("tenant_id").value = storedTenant;
        if (storedClient) document.getElementById("client_id").value = storedClient;
    });

    // Save values to localStorage on submit
    document.getElementById("loginForm").addEventListener("submit", function() {
        const remember = document.getElementById("remember_credentials").checked;
        const method = document.querySelector('input[name="auth_method"]:checked').value;
        
        if (remember) {
            localStorage.setItem("cosmos_auth_method", method);
            if (method === "conn_str") {
                localStorage.setItem("cosmos_conn_str", document.getElementById("conn_string").value);
            } else if (method === "key") {
                localStorage.setItem("cosmos_endpoint", document.getElementById("endpoint_key").value);
            } else if (method === "sp") {
                localStorage.setItem("cosmos_endpoint", document.getElementById("endpoint_sp").value);
                localStorage.setItem("cosmos_tenant_id", document.getElementById("tenant_id").value);
                localStorage.setItem("cosmos_client_id", document.getElementById("client_id").value);
            }
        } else {
            localStorage.clear();
        }
    });
</script>
{% endblock %}
